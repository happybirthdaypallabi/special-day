<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mayamoni</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- INTRO -->
<section class="intro" id="intro">
  <h1>শুভ জন্মদিন</h1>
  <h2>পল্লবী</h2>
  <h3>আমার মায়ামনি 🤍</h3>
  <button id="startBtn">🎁 তোমার জন্য সারপ্রাইজ দেখো</button>
</section>

<!-- CAKE -->
<section class="cake-section hidden" id="cakeSection">
  <h2>🎂 Happy Birthday Mayamoni 🎂</h2>

  <div class="cake">
    <div class="candles" id="candles"></div>
    <div class="layer top"></div>
    <div class="layer mid"></div>
    <div class="layer bottom"></div>
  </div>

  <p>🕯️ ১৯টা মোমবাতি এক এক করে জ্বালাও</p>

  <button id="blowBtn" class="hidden">💨 মোমবাতি নিভাও</button>
  <button id="cutBtn" class="hidden">🎂 কেক কাটো</button>
</section>

<!-- LETTER -->
<section class="letter hidden" id="letter">
  <h2>💌 তোমার জন্য</h2>
  <div id="letterText"></div>
</section>

<script src="script.js"></script>
</body>
</html>
